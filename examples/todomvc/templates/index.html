<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TodoMVC - Datastar, Nushell &amp; now, featuring Stardust</title>
    <meta
      name="description"
      content="A simple todo app demonstrating Datastar reactivity with http-nu, Nushell, and a Stardust database."
    >
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ url }}">
    <meta property="og:title" content="TodoMVC - Datastar, Nushell &amp; now, featuring Stardust">
    <meta
      property="og:description"
      content="A simple todo app demonstrating Datastar reactivity with http-nu, Nushell, and a Stardust database."
    >
    <meta property="og:image" content="{{ url }}static/og.png?v={{ rev }}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="TodoMVC app built with Datastar and Stardust">
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:image" content="{{ url }}static/og.png?v={{ rev }}">
    <link rel="stylesheet" href="static/style.css?v={{ rev }}">
    <script type="module" src="{{ datastar }}"></script>
  </head>
  <body>
    <main>
      <h1>TodoMVC</h1>
      <div style="text-align: center; color: var(--text-secondary); margin: 0; padding: 0 1em 0.5em 1em">
        <p style="margin: 0; padding-top: 0 !important; line-height: 1.8; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 0.3em">
          A simple todo app demonstrating
          <a
            href="https://data-star.dev/examples/todomvc"
            class="card"
            style="transform: rotate(-1.5deg)"
          >
            <span>Datastar</span>
          </a>
          reactivity with
          <a
            href="https://http-nu.cross.stream"
            class="card"
            style="transform: rotate(1deg)"
          >
            <span>HTTP-NU</span>
          </a>
          ,
          <a
            href="https://www.nushell.sh"
            class="card"
            style="transform: rotate(-0.8deg)"
          >
            <span>Nushell</span>
          </a>
          , and
          <a
            href="https://www.stardustdb.com"
            class="card"
            style="transform: rotate(1.2deg)"
          >
            <span>Stardust</span>
          </a>
          . See the
          <a
            href="https://github.com/cablehead/nu_plugin_stardust/tree/main/examples/todomvc"
            class="card"
            style="transform: rotate(0.5deg)"
          >
            <span>Source</span>
          </a>
          and
          <a
            href="/notes/"
            class="card"
            style="transform: rotate(-1deg)"
          >
            <span>Notes</span>
          </a>
          for this complete example.
        </p>
      </div>

      <!-- Time travel. $_steps lists the transactions that changed the list,
           oldest first, sent with each live update; the last is now. $at is
           the transaction shown, 0 for now (live), and $_pos its index in
           $_steps. $_playing steps forward on a timer until now. Signals
           starting with _ stay on the page: requests don't send them. The slider sits above the todos, so it stays put. -->
      <div
        class="time-travel"
        data-signals="{at: 0, _steps: [], _playing: false}"
        data-computed:_last="$_steps.length - 1"
        data-computed:_pos="$at == 0 ? $_steps.length - 1 : $_steps.indexOf($at)"
        data-init="@get('/sse')"
      >
        <!-- Play steps one change forward per tick, from wherever the slider
             is, and stops at now. Nothing to play while live. -->
        <button
          type="button"
          class="play"
          data-attr:aria-label="$_playing ? 'pause' : 'play'"
          data-attr:disabled="$at == 0"
          data-text="$_playing ? '\u275a\u275a' : '\u25b6'"
          data-on:click="$_playing = !$_playing"
          data-on-interval__duration.300ms="$_playing && ($at = $_pos + 1 >= $_last ? 0 : $_steps[$_pos + 1], $_playing = $at != 0, @get('/sse'))"
        >&#9654;</button>
        <button
          type="button"
          aria-label="previous change"
          data-attr:disabled="$_pos <= 0"
          data-on:click="$at = $_steps[Math.max(0, $_pos - 1)]; @get('/sse')"
        >&lsaquo;</button>
        <!-- max before value: a value past the old max would be clamped. -->
        <input
          type="range"
          min="0"
          aria-label="history"
          data-effect="el.max = $_last; el.value = $_pos"
          data-on:input__debounce.50ms="$at = +el.value >= $_last ? 0 : $_steps[+el.value]; @get('/sse')"
        />
        <button
          type="button"
          aria-label="next change"
          data-attr:disabled="$at == 0"
          data-on:click="$at = $_pos + 1 >= $_last ? 0 : $_steps[$_pos + 1]; @get('/sse')"
        >&rsaquo;</button>
        <button
          type="button"
          data-attr:aria-pressed="String($at == 0)"
          data-on:click="$_playing = false; $at != 0 && ($at = 0, @get('/sse'))"
        >Now</button>
      </div>

      <!-- Replaced by each /sse event: the header and the list. -->
      <div id="todos"></div>
    </main>
  </body>
</html>
