<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TodoMVC - Datastar & Stardust</title>
    <meta
      name="description"
      content="A simple todo app demonstrating Datastar reactivity with http-nu, Nushell, and a Stardust database."
    >
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ url }}">
    <meta property="og:title" content="TodoMVC - Datastar & Stardust">
    <meta
      property="og:description"
      content="A simple todo app demonstrating Datastar reactivity with http-nu, Nushell, and a Stardust database."
    >
    <meta property="og:image" content="{{ url }}static/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="TodoMVC app built with Datastar and Stardust">
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:image" content="{{ url }}static/og.png">
    <link rel="stylesheet" href="static/style.css">
    <script type="module" src="{{ datastar }}"></script>
    <script type="module" src="static/scrub-knob.js"></script>
  </head>
  <body>
    <main>
      <h1>TodoMVC</h1>
      <div style="text-align: center; color: var(--text-secondary); margin: 0; padding: 0 1em 0.5em 1em">
        <p style="margin: 0; padding-top: 0 !important; line-height: 1.8; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 0.3em">
          A simple todo app demonstrating
          <a
            href="https://data-star.dev/examples/todomvc"
            class="card"
            style="transform: rotate(-1.5deg)"
          >
            <span>Datastar</span>
          </a>
          reactivity with
          <a
            href="https://github.com/cablehead/http-nu"
            class="card"
            style="transform: rotate(1deg)"
          >
            <span>HTTP-NU</span>
          </a>
          ,
          <a
            href="https://www.nushell.sh"
            class="card"
            style="transform: rotate(-0.8deg)"
          >
            <span>Nushell</span>
          </a>
          , and
          <a
            href="https://www.stardustdb.com"
            class="card"
            style="transform: rotate(1.2deg)"
          >
            <span>Stardust</span>
          </a>
          . See the
          <a
            href="https://github.com/cablehead/nu_plugin_stardust/tree/main/examples/todomvc"
            class="card"
            style="transform: rotate(0.5deg)"
          >
            <span>Source</span>
          </a>
          for this complete example.
        </p>
      </div>

      <!-- Time travel. $at is the transaction shown, 0 for now (live). $latest
           is the transaction of the newest list, sent with each live update.
           The slider sits above the todos, so it stays put as they change. -->
      <div class="time-travel" data-signals="{at: 0, latest: 1}" data-init="@get('/sse')">
        <button
          type="button"
          aria-label="previous transaction"
          data-attr:disabled="$at == 1"
          data-on:click="$at = Math.max(1, ($at || $latest) - 1); @get('/sse')"
        >&lsaquo;</button>
        <scrub-knob
          min="1"
          px-per-frame="4"
          data-attr:max="$latest"
          data-attr:value="$at || $latest"
          data-on:scrub="$at = evt.detail.value >= $latest ? 0 : evt.detail.value; @get('/sse')"
        ></scrub-knob>
        <button
          type="button"
          aria-label="next transaction"
          data-attr:disabled="$at == 0"
          data-on:click="$at = $at + 1 >= $latest ? 0 : $at + 1; @get('/sse')"
        >&rsaquo;</button>
        <button
          type="button"
          data-attr:disabled="$at == 0"
          data-on:click="$at = 0; @get('/sse')"
        >Now</button>
      </div>

      <!-- Replaced by each /sse event: the header and the list. -->
      <div id="todos"></div>
    </main>
  </body>
</html>
